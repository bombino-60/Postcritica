[workspace]
resolver = "2"
members = [
  "apps/postcritica",
  "crates/raster",
  "crates/metadata",
  "crates/analysis",
  "crates/archive",
  "crates/ai",
  "crates/report",
  "crates/engine",
  "crates/ui-egui",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
postcritica-raster = { path = "crates/raster" }
postcritica-metadata = { path = "crates/metadata" }
postcritica-analysis = { path = "crates/analysis" }
postcritica-archive = { path = "crates/archive" }
postcritica-ai = { path = "crates/ai" }
postcritica-report = { path = "crates/report" }
postcritica-engine = { path = "crates/engine" }
postcritica-ui-egui = { path = "crates/ui-egui" }

eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "gif", "bmp", "webp"] }
kamadak-exif = "0.6"
rfd = "0.15"
log = "0.4"

# Un panic sfuggito deve poter essere intercettato dalla rete di sicurezza, non abortire.
[profile.release]
panic = "unwind"
